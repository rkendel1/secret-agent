name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catch a new @appport/* release that changes the surface the agent mirrors.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  agent-e2e:
    # The loop against real AppPort runtimes: the ignored end-to-end tests and the closed-loop test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: cargo test -p appport-agent -- --include-ignored
      # Fails unless every stage refuses or accepts as asserted, including a verified,
      # accepted change on rkendel1/appport-services after `npx appport init`.
      - run: scripts/closed-loop-test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop
          path: |
            target/closed-loop/*.json
            target/closed-loop/*.jsonl
            target/closed-loop/*.txt

  appport-drift-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-appport-drift.sh --pinned

  appport-drift-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-appport-drift.sh --latest
