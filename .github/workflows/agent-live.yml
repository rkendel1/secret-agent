name: agent-live

# The closed-loop evaluation with real models: the same intents, knowledge vs
# bare context, judged by the same deterministic verifier. Manual, because it
# downloads a model and takes a while; results are uploaded as artifacts.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Trials per arm and project
        default: "3"
      local_model:
        description: Ollama model for the local leg
        default: qwen2.5-coder:7b
      remote_model:
        description: Anthropic model for the remote leg (needs the ANTHROPIC_API_KEY secret)
        default: claude-sonnet-5-5

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - name: Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "${{ inputs.local_model }}"
      - run: TRIALS="${{ inputs.trials }}" scripts/closed-loop-test.sh --config examples/models/ollama.json --model "${{ inputs.local_model }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-local
          path: target/closed-loop

  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Require the key
        run: test -n "$ANTHROPIC_API_KEY" || { echo "set the ANTHROPIC_API_KEY repository secret"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: TRIALS="${{ inputs.trials }}" scripts/closed-loop-test.sh --config examples/models/anthropic.json --model "${{ inputs.remote_model }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-remote
          path: target/closed-loop
