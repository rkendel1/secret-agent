name: agent-live

# The closed-loop evaluation with real models: the same intents, knowledge vs
# bare context, judged by the same deterministic verifier. Manual, because it
# downloads a model and takes a while; results are uploaded as artifacts.
on:
  workflow_dispatch:
    inputs:
      legs:
        description: Which legs to run (comma-separated) - gateway, coding, arms, remote
        default: gateway
      trials:
        description: Trials per arm and project
        default: "10"
      gateway_model:
        description: Vercel AI Gateway model for the gateway, coding and arms legs (needs the AI_GATEWAY_API_KEY secret); a cheap model by default
        default: anthropic/claude-haiku-5.5
      min_success:
        description: Coding leg - fail when the observed arm's success rate is below this (0..1)
        default: "0.5"
      budget_usd:
        description: Arms leg - stop starting trials once measured spend reaches this (USD)
        default: "10"
      remote_model:
        description: Anthropic model for the remote leg (needs the ANTHROPIC_API_KEY secret)
        default: claude-opus-5-5

jobs:
  remote:
    if: contains(inputs.legs, 'remote')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Only for keys not scoped to a workspace.
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: Require the key
        run: test -n "$ANTHROPIC_API_KEY" || { echo "set the ANTHROPIC_API_KEY repository secret"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: TRIALS="${{ inputs.trials }}" scripts/closed-loop-test.sh --config examples/models/anthropic.json --model "${{ inputs.remote_model }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-remote
          path: target/closed-loop

  gateway:
    # The same evaluation through the Vercel AI Gateway (OpenAI-compatible API).
    if: contains(inputs.legs, 'gateway')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      MODEL: ${{ inputs.gateway_model || 'anthropic/claude-haiku-5.5' }}
      TRIALS: ${{ inputs.trials || '10' }}
    steps:
      - name: Require the key
        run: test -n "$AI_GATEWAY_API_KEY" || { echo "set the AI_GATEWAY_API_KEY repository secret"; exit 1; }
      - name: Check the model exists on the gateway
        run: |
          curl -fsS https://ai-gateway.vercel.sh/v1/models -H "Authorization: Bearer $AI_GATEWAY_API_KEY" > models.json
          echo "Anthropic models on the gateway:"; jq -r '.data[].id' models.json | grep -i anthropic || true
          if jq -e --arg m "$MODEL" '.data | any(.id == $m)' models.json > /dev/null; then
            echo "using $MODEL"
          else
            # The gateway may spell versions differently (5.5 vs 5-5). Accept exactly one
            # spelling of the requested family/version; anything else stops before any spend.
            family=$(echo "$MODEL" | sed -E 's#^.*/##; s#[.-]#[.-]#g')
            matches=$(jq -r '.data[].id' models.json | grep -E "^anthropic/${family}$" || true)
            if [ "$(echo "$matches" | grep -c .)" = 1 ]; then
              echo "using $matches (requested $MODEL)"; echo "MODEL=$matches" >> "$GITHUB_ENV"
            else
              echo "model $MODEL is not offered by the gateway (candidates: ${matches:-none})"; exit 1
            fi
          fi
      - name: Check the model answers (one 1-token call, before any trial)
        run: |
          status=$(curl -sS -o probe.json -w '%{http_code}' https://ai-gateway.vercel.sh/v1/chat/completions \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\": \"$MODEL\", \"max_tokens\": 1, \"messages\": [{\"role\": \"user\", \"content\": \"ok\"}]}")
          if [ "$status" != 200 ]; then
            echo "::error::$MODEL is not usable with this AI_GATEWAY_API_KEY (HTTP $status): $(head -c 400 probe.json)"
            exit 1
          fi
          echo "$MODEL answers"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: scripts/closed-loop-test.sh --config examples/models/vercel-gateway.json --model "$MODEL"
      - name: Results
        if: always()
        run: |
          for f in target/closed-loop/eval-*/eval.md; do echo "=== $f"; cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gateway
          path: |
            target/closed-loop/eval-*/eval.json
            target/closed-loop/eval-*/eval.md
            target/closed-loop/eval-*/*/report.json
            target/closed-loop/eval-*/*/run.jsonl
            target/closed-loop/eval-*/*/accepted.diff

  coding:
    # The coding-agent evaluation (no AppPort) through the Vercel AI Gateway.
    if: contains(inputs.legs, 'coding')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      MODEL: ${{ inputs.gateway_model || 'anthropic/claude-haiku-5.5' }}
      TRIALS: ${{ inputs.trials || '10' }}
      MIN_SUCCESS: ${{ inputs.min_success || '0.5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the key
        run: test -n "$AI_GATEWAY_API_KEY" || { echo "set the AI_GATEWAY_API_KEY repository secret"; exit 1; }
      - name: Check the model exists on the gateway
        run: |
          curl -fsS https://ai-gateway.vercel.sh/v1/models -H "Authorization: Bearer $AI_GATEWAY_API_KEY" > models.json
          echo "Anthropic models on the gateway:"; jq -r '.data[].id' models.json | grep -i anthropic || true
          if jq -e --arg m "$MODEL" '.data | any(.id == $m)' models.json > /dev/null; then
            echo "using $MODEL"
          else
            # The gateway may spell versions differently (5.5 vs 5-5). Accept exactly one
            # spelling of the requested family/version; anything else stops before any spend.
            family=$(echo "$MODEL" | sed -E 's#^.*/##; s#[.-]#[.-]#g')
            matches=$(jq -r '.data[].id' models.json | grep -E "^anthropic/${family}$" || true)
            if [ "$(echo "$matches" | grep -c .)" = 1 ]; then
              echo "using $matches (requested $MODEL)"; echo "MODEL=$matches" >> "$GITHUB_ENV"
            else
              echo "model $MODEL is not offered by the gateway (candidates: ${matches:-none})"; exit 1
            fi
          fi
      - name: Check the model answers (one 1-token call, before any trial)
        run: |
          status=$(curl -sS -o probe.json -w '%{http_code}' https://ai-gateway.vercel.sh/v1/chat/completions \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\": \"$MODEL\", \"max_tokens\": 1, \"messages\": [{\"role\": \"user\", \"content\": \"ok\"}]}")
          if [ "$status" != 200 ]; then
            echo "::error::$MODEL is not usable with this AI_GATEWAY_API_KEY (HTTP $status): $(head -c 400 probe.json)"
            exit 1
          fi
          echo "$MODEL answers"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-coding-fixtures.sh
      - run: |
          cargo run --quiet -p appport-agent -- code-eval --tasks fixtures/coding \
            --config examples/models/vercel-gateway.json --model "$MODEL" \
            --trials "$TRIALS" --arms observed,minimal --out target/coding-live \
            --min-success "$MIN_SUCCESS" --require-test-runs --quiet
      - name: Results
        if: always()
        run: |
          f=target/coding-live/coding-eval.md
          [ -f "$f" ] && { cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-coding
          path: |
            target/coding-live/coding-eval.*
            target/coding-live/*/*/report.json
            target/coding-live/*/*/run.jsonl
            target/coding-live/*/*/accepted.diff
            target/coding-live/*/*/hidden.txt

  arms:
    # Bare vs context-assisted vs AppPort-native, through the Vercel AI Gateway. Budgeted.
    if: contains(inputs.legs, 'arms')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      MODEL: ${{ inputs.gateway_model || 'anthropic/claude-haiku-5.5' }}
      TRIALS: ${{ inputs.trials || '10' }}
      BUDGET: ${{ inputs.budget_usd || '10' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the key
        run: test -n "$AI_GATEWAY_API_KEY" || { echo "set the AI_GATEWAY_API_KEY repository secret"; exit 1; }
      - name: Check the model exists on the gateway
        run: |
          curl -fsS https://ai-gateway.vercel.sh/v1/models -H "Authorization: Bearer $AI_GATEWAY_API_KEY" > models.json
          echo "Anthropic models on the gateway:"; jq -r '.data[].id' models.json | grep -i anthropic || true
          if jq -e --arg m "$MODEL" '.data | any(.id == $m)' models.json > /dev/null; then
            echo "using $MODEL"
          else
            # The gateway may spell versions differently (5.5 vs 5-5). Accept exactly one
            # spelling of the requested family/version; anything else stops before any spend.
            family=$(echo "$MODEL" | sed -E 's#^.*/##; s#[.-]#[.-]#g')
            matches=$(jq -r '.data[].id' models.json | grep -E "^anthropic/${family}$" || true)
            if [ "$(echo "$matches" | grep -c .)" = 1 ]; then
              echo "using $matches (requested $MODEL)"; echo "MODEL=$matches" >> "$GITHUB_ENV"
            else
              echo "model $MODEL is not offered by the gateway (candidates: ${matches:-none})"; exit 1
            fi
          fi
      - name: Check the model answers (one 1-token call, before any trial)
        run: |
          status=$(curl -sS -o probe.json -w '%{http_code}' https://ai-gateway.vercel.sh/v1/chat/completions \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\": \"$MODEL\", \"max_tokens\": 1, \"messages\": [{\"role\": \"user\", \"content\": \"ok\"}]}")
          if [ "$status" != 200 ]; then
            echo "::error::$MODEL is not usable with this AI_GATEWAY_API_KEY (HTTP $status): $(head -c 400 probe.json)"
            exit 1
          fi
          echo "$MODEL answers"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: |
          cargo run --quiet -p appport-agent -- arm-eval --tasks fixtures/appport-tasks \
            --config examples/models/vercel-gateway.json --model "$MODEL" \
            --trials "$TRIALS" --arms A,B,C --budget-usd "$BUDGET" --out target/arms-live --quiet
      - name: Results
        if: always()
        run: |
          f=target/arms-live/arm-eval.md
          [ -f "$f" ] && { cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-arms
          path: |
            target/arms-live/arm-eval.*
            target/arms-live/*/*/trial.json
            target/arms-live/*/*/report.json
            target/arms-live/*/*/run.jsonl
            target/arms-live/*/*/oracle.json
