name: agent-live

# Live-model evaluations through the Vercel AI Gateway, with a free model only.
#
# Manual (workflow_dispatch) only: no push or pull request runs live inference.
# Every run starts with the Rust preflight (`appport-agent preflight`): the model
# must be on the free allowlist, priced at zero by the gateway catalog, and
# answer one minimal completion. If it fails, no leg runs and the workflow fails.
# There is no Anthropic API path and no paid-model fallback. AI_GATEWAY_API_KEY
# is passed only to the steps that call the gateway.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preflight (checks only), smoke (two tasks, one trial, every arm) or comparison (every task)
        type: choice
        options: [smoke, preflight, comparison]
        default: smoke
      confirm_comparison:
        description: Required for mode=comparison (the long run)
        type: boolean
        default: false
      legs:
        description: Which legs to run (comma-separated) - arms, gateway, coding, experiment
        default: arms
      experiment_spec:
        description: Experiment leg - the specification to run (its model must be a free gateway model)
        default: examples/experiments/gateway-free-context.json
      gateway_model:
        description: Free Vercel AI Gateway model (must be on the allowlist in crates/agent-model/src/gateway.rs)
        default: nvidia/nemotron-3.5-lightning-free
      trials:
        description: Trials per arm and task (comparison only; smoke runs one)
        default: "5"
      max_model_calls:
        description: Arms leg - never start a trial that could exceed this many model calls
        default: "600"
      max_minutes:
        description: Arms leg - stop starting trials after this many minutes
        default: "100"
      min_success:
        description: Coding leg - fail when the observed arm's success rate is below this (0..1)
        default: "0"

permissions:
  contents: read

concurrency:
  group: agent-live
  cancel-in-progress: false

env:
  MODEL: ${{ inputs.gateway_model }}
  CONFIG: examples/models/vercel-gateway.json

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comparison needs confirmation
        if: inputs.mode == 'comparison' && !inputs.confirm_comparison
        run: |
          echo "::error::mode=comparison runs every task with ${{ inputs.trials }} trials per arm; tick confirm_comparison to run it"
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --quiet -p appport-agent
      - name: Preflight (allowlist, catalog pricing, one minimal completion)
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -o pipefail
          target/debug/appport-agent preflight --config "$CONFIG" --model "$MODEL" --out target/preflight \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: target/preflight
          if-no-files-found: ignore

  arms:
    # Bare vs context-assisted vs AppPort-native (docs/three-arm-eval.md).
    needs: preflight
    if: inputs.mode != 'preflight' && contains(inputs.legs, 'arms')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODE: ${{ inputs.mode }}
      TRIALS: ${{ inputs.trials }}
      MAX_CALLS: ${{ inputs.max_model_calls }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: cargo build --quiet -p appport-agent
      - name: Three-arm evaluation (preflight again, then trials)
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          target/debug/appport-agent arm-eval --tasks fixtures/appport-tasks --free-gateway --mode "$MODE" \
            --config "$CONFIG" --model "$MODEL" --trials "$TRIALS" --arms A,B,C \
            --max-model-calls "$MAX_CALLS" --max-minutes "$MAX_MINUTES" --out target/arms-live --quiet
      - name: Results
        if: always()
        run: |
          for f in target/arms-live/preflight.txt target/arms-live/arm-eval.md; do
            [ -f "$f" ] && { cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
          done
          true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-arms
          if-no-files-found: ignore
          path: |
            target/arms-live/preflight.*
            target/arms-live/arm-eval.*
            target/arms-live/*/*/trial.json
            target/arms-live/*/*/report.json
            target/arms-live/*/*/run.jsonl
            target/arms-live/*/*/oracle.json

  gateway:
    # The closed-loop evaluation (knowledge vs bare context).
    needs: preflight
    if: inputs.mode != 'preflight' && contains(inputs.legs, 'gateway')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRIALS: ${{ inputs.mode == 'comparison' && inputs.trials || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: cargo build --quiet -p appport-agent
      - name: Closed-loop evaluation (preflight again, then trials)
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          target/debug/appport-agent preflight --config "$CONFIG" --model "$MODEL" --out target/closed-loop/preflight
          scripts/closed-loop-test.sh --config "$CONFIG" --model "$MODEL"
      - name: Results
        if: always()
        run: |
          for f in target/closed-loop/eval-*/eval.md; do [ -f "$f" ] && { echo "=== $f"; cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }; done
          true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gateway
          if-no-files-found: ignore
          path: |
            target/closed-loop/preflight
            target/closed-loop/eval-*/eval.json
            target/closed-loop/eval-*/eval.md
            target/closed-loop/eval-*/*/report.json
            target/closed-loop/eval-*/*/run.jsonl
            target/closed-loop/eval-*/*/accepted.diff

  coding:
    # The coding-agent evaluation (no AppPort).
    needs: preflight
    if: inputs.mode != 'preflight' && contains(inputs.legs, 'coding')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRIALS: ${{ inputs.mode == 'comparison' && inputs.trials || '1' }}
      MIN_SUCCESS: ${{ inputs.min_success }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-coding-fixtures.sh
      - run: cargo build --quiet -p appport-agent
      - name: Coding evaluation (preflight again, then trials)
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          target/debug/appport-agent preflight --config "$CONFIG" --model "$MODEL" --out target/coding-live/preflight
          target/debug/appport-agent code-eval --tasks fixtures/coding --config "$CONFIG" --model "$MODEL" \
            --trials "$TRIALS" --arms observed,minimal --out target/coding-live \
            --min-success "$MIN_SUCCESS" --require-test-runs --quiet
      - name: Results
        if: always()
        run: |
          f=target/coding-live/coding-eval.md
          [ -f "$f" ] && { cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
          true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-coding
          if-no-files-found: ignore
          path: |
            target/coding-live/preflight
            target/coding-live/coding-eval.*
            target/coding-live/*/*/report.json
            target/coding-live/*/*/run.jsonl
            target/coding-live/*/*/accepted.diff
            target/coding-live/*/*/hidden.txt

  experiment:
    # A strategy comparison or ablation from an experiment specification
    # (docs/agent-research/experiments.md). The harness runs the free-model
    # preflight itself whenever the model is at the gateway, and no trial runs if it fails.
    needs: preflight
    if: inputs.mode != 'preflight' && contains(inputs.legs, 'experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SPEC: ${{ inputs.experiment_spec }}
      TRIALS: ${{ inputs.mode == 'comparison' && inputs.trials || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix examples/customers-app --no-audit --no-fund
      - run: scripts/check-coding-fixtures.sh
      - run: cargo build --quiet -p appport-agent
      - name: Experiment (preflight, then trials)
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          target/debug/appport-agent experiment --spec "$SPEC" --model "$MODEL" --trials "$TRIALS" \
            --out target/experiment-live --quiet
      - name: Results
        if: always()
        run: |
          for f in target/experiment-live/preflight.txt target/experiment-live/coding-eval.md; do
            [ -f "$f" ] && { cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
          done
          true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-experiment
          if-no-files-found: ignore
          path: |
            target/experiment-live/experiment.json
            target/experiment-live/preflight.*
            target/experiment-live/coding-eval.*
            target/experiment-live/*/*/trial.json
            target/experiment-live/*/*/report.json
            target/experiment-live/*/*/run.jsonl
            target/experiment-live/*/*/*.diff
            target/experiment-live/*/*/hidden.txt
