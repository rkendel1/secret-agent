[package]
name = "agent-model"
version = "0.1.0"
description = "Provider-agnostic model interface for the agent: local LLMs and remote providers behind one trait, chosen by configuration."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }

[dev-dependencies]
serde_json = "1.0.154"
